[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-micrositing"
version = "0.1.0"
description = "Oriented-grid wind turbine siting and capacity estimate inside a developable-area polygon (screening level only)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wind_micrositing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
