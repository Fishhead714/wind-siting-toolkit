[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-turbine-suitability"
version = "0.1.0"
description = "Screening-level turbine-class suitability check (IEC 61400-1 style class fit) for wind sites"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wind_turbine_suitability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
