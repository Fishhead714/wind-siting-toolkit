[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-energy-uncertainty"
version = "0.1.0"
description = "Loss chain and uncertainty combination to P50/P75/P90/P99 exceedance values (screening level, normal-distribution assumption)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wind_energy_uncertainty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
