# Demo configuration for render_map.py. SYNTHETIC data only; generate it with make_demo_data.py.
# Relative paths are resolved against the directory of this file, so the renderer can be
# started from any working directory:
#   python3 ../scripts/render_map.py --config demo_maps.yaml --outdir out/
# The criterion lines below are labelled "example criterion"; they are not taken from any
# regulation.
crs: EPSG:32625

defaults:
  size: [1800, 1350]
  dpi: 150
  margin: 0.08
  background: "#FFFFFF"
  legend: true
  title_on_image: true
  scalebar: true
  north: true
  labels: auto
  physical_height_cm: 13
  decoration_layout: panel-right
  extent_layers: [boundary, buildings]
  source: "Synthetic demo data (not a real site)"
  source_label: "Data:"
  date_label: "Date:"
  scale_ratio_label: "1:{denom}"

layers:
  boundary:
    source: demo_site.gpkg
    layername: boundary
    style: project_boundary
    label: Site boundary
  buildings:
    source: demo_site.gpkg
    layername: buildings
    style: {kind: fill, color: "#BDBDBD", outline_color: "#616161", outline_width_mm: 0.15}
    label: Buildings
  wtg:
    source: demo_site.gpkg
    layername: wtg
    style: turbine_position_ringset
    label: Wind turbine
    label_field: wtg_id
    labels_enabled: true
    label_obstacle: true
  rec_ok:
    source: demo_site.gpkg
    layername: receptors
    style: receptor
    filter: "exceeds = 0"
    label: "Receptor (below example criteria)"
  rec_exceed:
    source: demo_site.gpkg
    layername: receptors
    style: receptor_exceed
    filter: "exceeds = 1"
    label: "Receptor (at or above an example criterion)"

  # One table, two layers: the criterion contour is picked out with a filter.
  noise_lines:
    source: demo_contours.gpkg
    layername: noise_contour
    style: noise_contour
    filter: "level_db <> 40"
    label: "Noise contour, dB(A) (synthetic)"
    label_field: "level_db || ' dB'"
    label_placement: curved
    labels_enabled: true
  noise_limit:
    source: demo_contours.gpkg
    layername: noise_contour
    style: noise_contour_limit
    filter: "level_db = 40"
    label: "40 dB(A) contour (example criterion)"
    label_field: "level_db || ' dB'"
    label_placement: curved
    labels_enabled: true

  flicker_band:
    source: demo_contours.gpkg
    layername: flicker_band
    style: flicker_band
    filter: "\"case\" = 'astronomical_max'"
    label: Shadow flicker, astronomical maximum (synthetic)
  flicker_lines:
    source: demo_contours.gpkg
    layername: flicker_isoline
    style: flicker_isoline
    filter: "\"case\" = 'astronomical_max' AND hours_per_year <> 30"
    label: Flicker isoline (8 / 100 h/year)
  flicker_key:
    source: demo_contours.gpkg
    layername: flicker_isoline
    style: flicker_isoline_key
    filter: "\"case\" = 'astronomical_max' AND hours_per_year = 30"
    label: "30 h/year line (example criterion)"
    label_field: "hours_per_year || ' h'"
    label_placement: curved
    labels_enabled: true

  # Constraint layers and the output of derive_developable_area.py.
  # exclusion_type groups restriction layers in the legend (hard / review / soft).
  dwelling_setback:
    source: demo_exclusions.gpkg
    layername: dwelling_setback
    style: restriction_community
    style_overrides: {exclusion_type: hard}
    label: "Dwelling setback, 500 m (example)"
  road_setback:
    source: demo_exclusions.gpkg
    layername: road_setback
    style: restriction_highway
    label: "Road setback, 150 m (example)"
  developable:
    source: demo_developable.gpkg
    layername: developable_area
    style: developable_area
    label: Developable area

views:
  - out: demo_noise
    title: "Noise contours, night (synthetic demo)"
    layers: [wtg, noise_limit, noise_lines, rec_exceed, rec_ok, buildings, boundary]
  - out: demo_flicker_bands
    title: "Shadow flicker, worst case (synthetic demo)"
    extent_layers: [flicker_band, buildings]
    layers: [wtg, flicker_key, flicker_lines, rec_exceed, rec_ok, flicker_band, buildings, boundary]
  - out: demo_developable
    title: "Developable area (synthetic demo)"
    extent_layers: [boundary]
    layers: [wtg, boundary, dwelling_setback, road_setback, developable, buildings]
