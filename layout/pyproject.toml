[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-layout"
version = "0.1.0"
description = "Terrain-aware wind turbine layout screening pipeline (screening / pre-feasibility only)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "py_wake>=2.5",
    "topfarm>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["wind_layout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::PendingDeprecationWarning", "ignore:numpy.ndarray size changed:RuntimeWarning"]
